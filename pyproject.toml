[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-system-debris-disc-benchmark"
version = "1.0.0"
description = "Reproducible analysis accompanying the Solar-System debris-disc planet-inference benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "Rishin Georgy Anil"},
  {name = "Avaneesh Subramanian"},
  {name = "Tim D. Pearce"},
]
dependencies = [
  "astropy==7.1.1",
  "lmfit==1.3.4",
  "matplotlib==3.10.7",
  "numpy==2.3.3",
  "scikit-image==0.26.0",
  "scipy==1.16.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/solar_system_debris_disc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
